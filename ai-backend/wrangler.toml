name = "timo-agent"
main = "worker.js"
compatibility_date = "2026-11-27"
workers_dev = true

[vars]
ALLOWED_ORIGIN = "https://inveniom.github.io"
OPENAI_MODEL = "gpt-4.1-mini"
DEMO_MODE = "false"

[[durable_objects.bindings]]
name = "DB"
class_name = "ThimoDatabase"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ThimoDatabase"]

# Maak deze bucket eerst aan in Cloudflare R2: thimo365-documents
[[r2_buckets]]
binding = "DOCUMENTS"
bucket_name = "thimo365-documents"
