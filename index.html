<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Thimo365 | Project Navigator</title><style>
:root{--green:#274638;--lime:#d8e4b9;--paper:#f6f7f2;--line:#dce3d9;--ink:#233c30}*{box-sizing:border-box}body{margin:0;font-family:Manrope,Arial,sans-serif;color:var(--ink);background:var(--paper)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:5px;padding:12px 18px;background:var(--green);color:white;font-weight:600}button.alt{background:white;color:var(--green);border:1px solid var(--line)}header{background:var(--green);color:white;padding:18px 4%;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}.logo{font-size:32px;font-weight:800;letter-spacing:-2px}.logo span{color:var(--lime)}.logo small{display:block;font-size:10px;letter-spacing:2px;font-weight:400}.switch button{background:transparent;border:1px solid #93a499}.switch .active{background:var(--lime);color:var(--green)}.shell{display:grid;grid-template-columns:240px 1fr;min-height:calc(100vh - 100px)}nav{background:#e9eee5;padding:28px 16px}nav button{display:block;width:100%;text-align:left;background:transparent;color:var(--ink);margin:3px 0;font-weight:500}nav button.active{background:#d6e1cc;font-weight:700}main{max-width:1250px;width:100%;padding:40px 5%;margin:auto;align-self:start}h1{font-size:clamp(28px,4vw,48px);letter-spacing:-1.6px;line-height:1.08;margin:10px 0 20px}h2{font-size:21px;margin:0 0 16px}p{line-height:1.6;color:#53665a}small,.muted{color:#63756a;font-size:13px}.eyebrow{font-size:12px;letter-spacing:2px;text-transform:uppercase;font-weight:bold;color:#66816c}.hero{background:#dfe8d0;border-radius:10px;padding:36px;display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:center;margin-bottom:24px}.hero svg{width:100%}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin:20px 0}.card{background:white;border:1px solid var(--line);border-radius:9px;padding:24px;margin-bottom:16px}.grid .card{margin:0}.metric{font-size:34px;font-weight:700;margin:12px 0}.line{display:flex;justify-content:space-between;align-items:center;gap:15px;border-bottom:1px solid var(--line);padding:15px 0}.line:last-child{border:0}.tag{background:#e8eedc;border-radius:5px;padding:6px 10px;font-size:12px;text-align:right}.fields{display:grid;grid-template-columns:1fr 1fr;gap:18px}label{display:block;font-size:13px;font-weight:600;margin-bottom:7px}input,select,textarea{width:100%;border:1px solid #cbd7ca;border-radius:5px;padding:12px;background:white;color:var(--ink)}textarea{min-height:130px;resize:vertical}.notice{background:#f2eedf;padding:16px;border-radius:6px;margin:16px 0;color:#6e5e38;line-height:1.5}.bar{height:9px;background:#e6ebe4;border-radius:10px;margin:8px 0 18px;overflow:hidden}.bar i{display:block;height:100%;background:#64866b}.house{width:100%;background:#edf0e7;border-radius:5px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}footer{padding:20px 4%;border-top:1px solid var(--line);font-size:12px;color:#647568}table{border-collapse:collapse;width:100%;font-size:14px}td,th{text-align:left;padding:12px;border-bottom:1px solid var(--line)}th{background:#e9eee5} @media(max-width:760px){.shell{display:block}nav{display:flex;overflow:auto;padding:8px}nav button{width:auto;white-space:nowrap}.hero,.fields{grid-template-columns:1fr}main{padding:24px 5%}.card{padding:16px}.hero{padding:24px}table{font-size:12px}}
</style></head><body><header><div class="logo">thimo<span>365</span><small>PROJECT NAVIGATOR</small></div><div class="switch"><button id="client">Klantomgeving</button> <button id="staff">Medewerkersomgeving</button></div></header><div class="shell"><nav id="nav"></nav><main id="main"></main></div><footer>Thimo365 Project Navigator · Zelfstandige demonstratie · Fictieve gegevens · Concept-huisstijl · <button class="alt" id="reset">Demo herstellen</button></footer><script>
const initial={name:'De Groene Hof',org:'Woningcorporatie',loc:'',count:24,target:'Sociale huur',budget:'',status:'Locatie in onderzoek',type:'Comfort 55',saved:false,decision:false,questions:[],analysis:[],notes:[]};let p;try{p=JSON.parse(localStorage.getItem('thimo-demo-v1'))||structuredClone(initial)}catch{p=structuredClone(initial)}let role='client',page='Overzicht',search='',draft='';const menus={client:['Overzicht','Projectintake','Woningconfiguratie','Productkennisbank','Haalbaarheid','Mijn project'],staff:['Dashboard','Klantprojecten','AI-vraagfilter','Productbibliotheek','Projectbesluiten','Commerciële kansen']};const kb=[['Woningtypen en afmetingen','Woonoppervlak en woningconfiguraties','Afmetingen en woningtypen'],['Constructie en materialen','Materiaalkeuze en constructie','Constructie en hout'],['Energie en duurzaamheid','Energieprestaties en circulariteit','Energie en duurzaamheid'],['Onderhoud en garanties','Onderhoud en garanties','Onderhoud'],['Planning en realisatie','Indicatieve procesfasen','Doorlooptijd en planning'],['Certificaten en prestaties','Beschikbare prestatieverklaringen','Certificaten']];const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>{try{localStorage.setItem('thimo-demo-v1',JSON.stringify(p))}catch{}};const button=(t,a,alt=false)=>`<button ${alt?'class="alt"':''} data-act="${a}">${t}</button>`;const go=(t)=>button(t,'go:'+t);const title=(a,b,c='')=>`<div class="eyebrow">${a}</div><h1>${b}</h1>${c?`<p>${c}</p>`:''}`;const line=(a,b)=>`<div class="line"><span>${a}</span><span class="tag">${b}</span></div>`;const metric=(a,b)=>`<div class="card"><div class="muted">${b}</div><div class="metric">${a}</div></div>`;const field=(label,k,typ='text')=>`<div><label for="${k}">${label}</label><input id="${k}" data-key="${k}" type="${typ}" ${typ==='number'?'min="1"':''} value="${esc(p[k])}"></div>`;const sel=(label,k,opts)=>`<div><label>${label}</label><select data-key="${k}">${opts.map(o=>`<option ${o===p[k]?'selected':''}>${esc(o)}</option>`).join('')}</select></div>`;const house=(i=1)=>`<svg class="house" viewBox="0 0 400 210" role="img" aria-label="Illustratieve modulaire woning"><rect width="400" height="210" fill="#e5ebdd"/><path d="M0 175H400" stroke="#a4b79c"/><ellipse cx="200" cy="182" rx="165" ry="12" fill="#ccd6c4"/><path d="M60 75L240 42L340 77L160 110Z" fill="#44584c"/><path d="M60 75L160 110V175L60 144Z" fill="#b4a38b"/><path d="M160 110L340 77V143L160 175Z" fill="#c4b69b"/><g fill="#47645c"><path d="M76 95L105 104V135L76 126Z"/><path d="M118 110L144 118V150L118 142Z"/><path d="M180 120L218 113V146L180 153Z"/><path d="M232 110L270 103V136L232 143Z"/><path d="M284 100L323 93V126L284 133Z"/></g><g stroke="#e3dac6" opacity=".8">${Array.from({length:12},(_,j)=>`<path d="M${166+j*14} ${109-j*2.5}v65"/>`).join('')}</g><circle cx="35" cy="134" r="22" fill="#8da77c"/><circle cx="365" cy="133" r="26" fill="#91a981"/></svg>`;
const home=()=>`<div class="hero"><div><div class="eyebrow">Samen wonen realiseren</div><h1>Van woonvraag naar woonoplossing.</h1><p>Een gedeeld projectdossier, van de eerste verkenning tot gezamenlijke besluiten.</p>${go('Projectintake')}</div>${house()}</div><h2>Uw project</h2><div class="grid">${metric(esc(p.count),'Gewenste woningen')}${metric(p.saved?'Ingediend':'Concept','Projectintake')}${metric(p.decision?'Afgerond':'Open','Besluit locatieonderzoek')}</div><div class="card"><h2>${esc(p.name)}</h2>${line('Woningconcept',esc(p.type))}${line('Locatie',esc(p.loc||'Nog onbekend'))}${go('Mijn project')}</div>`;
const intake=()=>title('Stap 01','Uw huisvestingsopgave','Er wordt eenmalig vastgelegd wat u wilt realiseren.')+`<form class="card" id="intake"><div class="fields">${field('Projectnaam','name')}${sel('Type opdrachtgever','org',['Woningcorporatie','Gemeente','Investeerder','Zorgorganisatie'])}${field('Locatie of adres','loc')}${field('Aantal woningen','count','number')}${sel('Doelgroep','target',['Sociale huur','Middenhuur','Senioren','Jongeren','Gemengd'])}${sel('Locatiestatus','status',['Locatie in onderzoek','Locatie beschikbaar','Nog geen locatie'])}${field('Indicatief budget','budget')}</div><div class="actions"><button type="submit">Intake indienen</button></div></form>`;
const config=()=>title('Stap 02','Woningen configureren','Illustratieve woningtypen; geen officiële Thimo365-specificaties.')+`<div class="grid">${['Compact 40','Comfort 55','Ruimte 75'].map((t,i)=>`<div class="card">${house(i)}<h2>${t}</h2><p>${t.split(' ')[1]} m² indicatief</p>${button(p.type===t?'Geselecteerd':'Selecteren','type:'+t,p.type!==t)}</div>`).join('')}</div><div class="card">${field('Aantal woningen','count','number')}${line('Totaal indicatief woonoppervlak',Number(p.count)*Number(p.type.split(' ')[1])+' m²')}<div class="actions">${go('Haalbaarheid')}</div></div>`;
const library=()=>title('Gedeelde kennisbasis',role==='client'?'Productkennisbank':'Productbibliotheek','Eén informatiebron voor klant en medewerker.')+`<div class="card"><label>Zoeken in productinformatie</label><input id="search" value="${esc(search)}" placeholder="Bijvoorbeeld energie of onderhoud"><div id="results">${records()}</div></div><div class="notice">De bibliotheek bevat voorbeeldrecords. Er zijn geen gevalideerde technische prestaties of garanties opgenomen.</div>`;function records(){return kb.filter(a=>a.join(' ').toLowerCase().includes(search.toLowerCase())).map(a=>`<div class="line"><div><strong>${a[0]}</strong><p>${a[1]}</p></div><span class="tag">Voorbeeldrecord</span></div>`).join('')||'<p>Geen resultaten.</p>'}
const feasibility=()=>title('Stap 03','Eerste haalbaarheidsverkenning')+`<div class="card">${line('Huisvestingsopgave',p.saved?'Vastgelegd':'Onvolledig')}${line('Locatiegegevens',p.loc?'Opgegeven':'Ontbreken')}${line('Omgevingsplan','Te toetsen')}${line('Technische haalbaarheid','Te valideren')}${line('Financiële haalbaarheid','Te berekenen')}</div><div class="notice">Er wordt geen technische haalbaarheid, prijs of vergunning gegarandeerd. Specialistische beoordeling blijft nodig.</div>${go('Mijn project')}`;
const dossier=()=>title('Gedeeld projectdossier',esc(p.name))+`<div class="card">${line('Opdrachtgever',esc(p.org))}${line('Aantal woningen',esc(p.count))}${line('Woningconcept',esc(p.type))}${line('Locatie',esc(p.loc||'Onbekend'))}${line('Intake',p.saved?'Ingediend':'Concept')}${line('Locatieonderzoek',p.decision?'Voorbereiding akkoord':'Besluit nodig')}</div><div class="card"><h2>Gerichte projectvraag</h2><label>Bij welk besluit is aanvullende informatie nodig?</label><textarea id="question" placeholder="Beschrijf uw vraag en het gewenste besluit"></textarea><div class="actions">${button('Vraag indienen','question')}</div></div><div class="card"><h2>Ingediende vragen</h2>${p.questions.map(q=>line(esc(q.text),esc(q.status))).join('')||'<p>Nog geen vragen.</p>'}</div>`;
const dashboard=()=>title('Medewerkersomgeving','Regie op klantprojecten','De aandacht wordt gericht op uitzonderingen, afwijkingen en besluiten.')+`<div class="grid">${metric(3,'Actieve demoprojecten')}${metric(p.questions.filter(q=>q.status==='Nieuw').length,'Nieuwe klantvragen')}${metric(p.decision?0:1,'Open projectbesluiten')}</div><div class="card"><h2>Aandacht gevraagd</h2>${line(esc(p.name),p.saved?'Intake ontvangen':'Conceptintake')}${line('Locatieonderzoek',p.decision?'Akkoord':'Besluit nodig')}${line('Vraagfilter',p.analysis.length?p.analysis.length+' vragen geanalyseerd':'Nog niet uitgevoerd')}<div class="actions">${go('AI-vraagfilter')}${go('Projectbesluiten')}</div></div>`;
const projects=()=>title('Projectportfolio','Klantprojecten')+`<div class="card">${line(esc(p.name),p.saved?'Intake ontvangen':'Concept')}${line('De Brink · 36 woningen','Haalbaarheid')}${line('Parkzicht · 48 woningen','Voorbereiding')}<div class="actions">${button('Open gezamenlijk dossier','clientdossier')}</div></div><p class="muted">Alle projecten zijn fictief.</p>`;
const categories=['Kennisbank','Dubbel of overlappend','Latere projectfase','Projectspecifiek','Gezamenlijk besluit'];const sample=['Wat is de energieprestatie?','Wat is de energieprestatie?','Welke materialen worden toegepast?','Wat is de planning?','Hoe wordt het onderhoud geregeld?','Welke certificaten zijn beschikbaar?','Hoe wordt de fundering op deze locatie ontworpen?','Wie neemt het besluit over locatieonderzoek?','Wat is de definitieve opleverinspectie?','Wat kost het specifieke project?'];function classify(t,seen){let k=t.toLowerCase().trim().replace(/[^\p{L}\p{N} ]/gu,'').replace(/\s+/g,' ');if(seen.has(k))return categories[1];seen.add(k);if(/opleverinspectie|na oplevering|later stadium/.test(k))return categories[2];if(/besluit|akkoord|goedkeuring/.test(k))return categories[4];if(/specifiek|deze locatie|fundering|prijs|kost/.test(k))return categories[3];if(/energie|materiaal|onderhoud|garantie|certificat|planning|afmeting|woningtype|doorlooptijd/.test(k))return categories[0];return categories[3]}
const filter=()=>title('Van vraag naar besluit','AI-vraagfilter','De demonstratie gebruikt eenvoudige lokale herkenningsregels, geen echte AI. Elke indeling kan handmatig worden aangepast.')+`<div class="card"><label>Uitvraag (één vraag per regel)</label><textarea id="draft" placeholder="Plak een reeks klantvragen">${esc(draft)}</textarea><div class="actions">${button('Voorbeelduitvraag laden','sample',true)}${button('Analyse uitvoeren','analyse')}</div>${p.questions.length?`<div class="actions">${button('Klantvragen toevoegen','import',true)}</div>`:''}</div>${analysisView()}`;function analysisView(){if(!p.analysis.length)return '';let counts=categories.map(c=>p.analysis.filter(q=>q.category===c).length);return `<div class="card"><h2>Resultaat vraaganalyse</h2><div class="grid">${metric(p.analysis.length,'Ontvangen vragen')}${metric(counts[3]+counts[4],'Inhoudelijk te beoordelen')}</div>${categories.map((c,i)=>`<div class="line"><span>${c}</span><strong>${counts[i]}</strong></div><div class="bar"><i style="width:${100*counts[i]/p.analysis.length}%"></i></div>`).join('')}<p class="muted">Een koppeling aan een voorbeeldrecord is geen inhoudelijk antwoord. Menselijke controle blijft noodzakelijk.</p></div><div class="card"><h2>Beoordeling per vraag</h2>${p.analysis.map((q,i)=>`<div class="line"><div style="flex:1">${esc(q.text)}</div><select style="max-width:230px" data-class="${i}">${categories.map(c=>`<option ${q.category===c?'selected':''}>${c}</option>`).join('')}</select></div>`).join('')}</div>`}
const decisions=()=>title('Menselijke besluitvorming','Projectbesluiten')+`<div class="card"><span class="tag">${p.decision?'Afgerond':'Ter beoordeling'}</span><h2 style="margin-top:16px">Locatieonderzoek · ${esc(p.name)}</h2><p>Er wordt bepaald of een afzonderlijk locatieonderzoek wordt voorbereid. Dit besluit heeft geen contractuele betekenis.</p>${button(p.decision?'Besluit heropenen':'Voorbereiding akkoord','decision')}</div>`;
const commercial=()=>title('Commerciële werkwijze','Van verkenning naar opdracht')+`<div class="card"><table><thead><tr><th>Dienstverlening</th><th>Model</th></tr></thead><tbody>${[['Algemene productinformatie','Vrij toegankelijk'],['Standaard projectverkenning','Kosteloos'],['Indicatieve configuratie','Kosteloos'],['Uitgebreid locatieonderzoek','Betaalde opdracht'],['Gedetailleerde businesscase','Betaalde opdracht'],['Technische maatwerkuitwerking','Betaalde opdracht'],['Projectontwikkeling','Contractuele samenwerking']].map(([a,b])=>`<tr><td>${a}</td><td>${b}</td></tr>`).join('')}</tbody></table></div>`;
const views={'Overzicht':home,'Projectintake':intake,'Woningconfiguratie':config,'Productkennisbank':library,'Haalbaarheid':feasibility,'Mijn project':dossier,'Dashboard':dashboard,'Klantprojecten':projects,'AI-vraagfilter':filter,'Productbibliotheek':library,'Projectbesluiten':decisions,'Commerciële kansen':commercial};function render(){document.getElementById('client').className=role==='client'?'active':'';document.getElementById('staff').className=role==='staff'?'active':'';document.getElementById('nav').innerHTML=menus[role].map(t=>`<button data-act="go:${t}" class="${page===t?'active':''}">${t}</button>`).join('');document.getElementById('main').innerHTML=views[page]();save()}function switchRole(r){role=r;page=menus[r][0];render()}document.getElementById('client').onclick=()=>switchRole('client');document.getElementById('staff').onclick=()=>switchRole('staff');document.getElementById('reset').onclick=()=>{if(confirm('Alle lokale demogegevens herstellen?')){p=structuredClone(initial);draft='';switchRole('client')}};document.addEventListener('input',e=>{let el=e.target;if(el.dataset.key){p[el.dataset.key]=el.type==='number'?Math.max(0,Number(el.value)):el.value;save()}if(el.id==='search'){search=el.value;document.getElementById('results').innerHTML=records()}if(el.id==='draft')draft=el.value});document.addEventListener('change',e=>{if(e.target.dataset.class!==undefined){p.analysis[Number(e.target.dataset.class)].category=e.target.value;render()}else if(e.target.dataset.key==='count'&&page==='Woningconfiguratie')render()});document.addEventListener('submit',e=>{if(e.target.id==='intake'){e.preventDefault();if(!p.name.trim()||p.count<1){alert('Vul een projectnaam en geldig aantal woningen in.');return}p.saved=true;page='Woningconfiguratie';render()}});document.addEventListener('click',e=>{let a=e.target.closest('[data-act]')?.dataset.act;if(!a)return;if(a.startsWith('go:')){page=a.slice(3);search=''}else if(a.startsWith('type:'))p.type=a.slice(5);else if(a==='question'){let q=document.getElementById('question').value.trim();if(!q)return;p.questions.push({text:q,status:'Nieuw'})}else if(a==='sample')draft=sample.join('\n');else if(a==='import')draft=[draft,...p.questions.map(q=>q.text)].filter(Boolean).join('\n');else if(a==='analyse'){let seen=new Set();p.analysis=draft.split('\n').map(t=>t.trim()).filter(Boolean).map(text=>({text,category:classify(text,seen)}));p.questions.forEach(q=>{if(p.analysis.some(x=>x.text===q.text))q.status='Geanalyseerd'})}else if(a==='decision')p.decision=!p.decision;else if(a==='clientdossier'){role='client';page='Mijn project'}render()});render();
</script></body></html>
