/* Thimo365-inspired visual refinement — stronger, clearly visible brand layer */

async function runLogisticsCheck(){
 const input=document.getElementById('logisticsAddress'),address=(input?.value||'').trim();
 if(!address){alert('Vul eerst het afleveradres in.');return}
 const d=logisticsData();d.address=address;d.result=null;saveLogisticsData(d);render();
 try{
  const geo=await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&q='+encodeURIComponent(address+', Netherlands'),{headers:{'Accept':'application/json'}});
  if(!geo.ok)throw new Error('Locatie kon niet worden opgezocht.');
  const places=await geo.json();if(!places.length)throw new Error('Geen locatie gevonden. Controleer straat, postcode en plaats.');
  const p=places[0],lat=Number(p.lat),lon=Number(p.lon),startLon=4.14,startLat=51.95;
  const route=await fetch('https://router.project-osrm.org/route/v1/driving/'+startLon+','+startLat+';'+lon+','+lat+'?overview=false&alternatives=false&steps=false');
  if(!route.ok)throw new Error('Route-indicatie is tijdelijk niet beschikbaar.');
  const rd=await route.json();if(rd.code!=='Ok'||!rd.routes?.length)throw new Error('Geen route-indicatie beschikbaar voor deze locatie.');
  const rr=rd.routes[0],km=rr.distance/1000,mins=rr.duration/60;
  const pad=.012,bbox=[lon-pad,lat-pad,lon+pad,lat+pad].join('%2C');
  d.result={display:p.display_name,lat,lon,bbox,distance:km.toLocaleString('nl-NL',{maximumFractionDigits:1})+' km',duration:(mins/60).toLocaleString('nl-NL',{maximumFractionDigits:1})+' uur',routeNote:'Standaard route-indicatie vanaf een indicatief punt in het Rotterdamse havengebied; geen routegoedkeuring voor zwaar of exceptioneel transport.',mapUrl:'https://www.openstreetmap.org/directions?engine=fossgis_osrm_car&route='+startLat+'%2C'+startLon+'%3B'+lat+'%2C'+lon};
  saveLogisticsData(d);render();
 }catch(err){const status=document.getElementById('logisticsStatus');alert(err.message||'Locatiecontrole mislukt.');}
}

function customerOverview(){
 const ids=Object.keys(demoClients),turns=Object.values(K.chats).flat();
 return title('Medewerkersomgeving','Klantenoverzicht','Een klantkaart per project met voortgang, vragen, kennis en financiële indicatie.')+'<div class="grid">'+metric(ids.length,'Demo-klanten')+metric(turns.length,'Gesprekken')+metric(K.queue.filter(q=>q.status==='Open').length,'Open klantvragen')+metric(K.records.filter(r=>r.project==='general'&&r.approved&&r.visible).length,'Vrijgegeven kennisbankrecords')+'</div>'+ids.map(id=>{const c=demoClients[id],n=K.chats[id]?.length||0,records=K.records.filter(r=>r.project===id).length,open=K.queue.filter(q=>q.project===id&&q.status==='Open').length;return '<div class="card customer-card"><div class="eyebrow">'+esc(c.organisation)+'</div><h2>'+esc(c.name)+'</h2><div class="grid customer-metrics"><div><strong>'+c.units+'</strong><small>Units (demo)</small></div><div><strong>'+n+'</strong><small>Gespreksbeurten</small></div><div><strong>'+records+'</strong><small>Projectrecords</small></div><div><strong>'+open+'</strong><small>Open vragen</small></div></div>'+line('Locatie',esc(c.location))+line('Fase',esc(c.status))+'<div class="actions">'+button('Open klantomgeving','clientOpen:'+id)+button('Bekijk financiën','financeClient:'+id,true)+'</div></div>'}).join('');
}
function demoFinancials(id){
 const c=demoClients[id],unit=c.unit||'Thimo365',n=c.units,unitPrices={Thimo265:85000,Thimo365:105000,Thimo465:125000};
 const items=[['Units',unitPrices[unit]*n],['Transport',3500+750*n],['Hijsen en positioneren',1800+650*n],['Plaatsing en montage',4500*n],['Fundering',8500*n],['Elektrische aansluiting',3500],['Water en riool',4500],['Data',950],['Engineering',6500]];
 const sub=items.reduce((a,b)=>a+b[1],0),reserve=Math.round(sub*.1),ex=sub+reserve,vat=Math.round(ex*.21);
 const euro=x=>x.toLocaleString('nl-NL',{style:'currency',currency:'EUR',maximumFractionDigits:0});
 return {items,sub,reserve,ex,vat,total:ex+vat,euro};
}
function financeView(){
 const ids=Object.keys(demoClients),all=ids.map(id=>({id,c:demoClients[id],f:demoFinancials(id)})),total=all.reduce((a,x)=>a+x.f.total,0);
 const chosen=financeClientId&&demoClients[financeClientId]?financeClientId:null;
 return title('Medewerkersomgeving','Financiën','Projectramingen, kostenopbouw en totalen per klant. Alle bedragen zijn fictieve demo-aannames.')+'<div class="notice"><strong>Let op: uitsluitend fictieve bedragen.</strong> Dit zijn geen werkelijke offertes, verkoopprijzen, inkoopkosten of marges van Thimo365. Valideer bedragen en btw-behandeling voordat ze zakelijk worden gebruikt.</div><div class="grid">'+metric(euroCompact(total),'Totale demo-raming incl. btw')+metric(ids.length,'Projectramingen')+metric(all.reduce((a,x)=>a+x.f.ex,0).toLocaleString('nl-NL',{style:'currency',currency:'EUR',maximumFractionDigits:0}),'Totaal excl. btw')+'</div><div class="card"><h2>Financieel overzicht per klant</h2><table><thead><tr><th>Klant</th><th>Units</th><th>Excl. btw</th><th>Incl. btw</th><th></th></tr></thead><tbody>'+all.map(x=>'<tr><td>'+esc(x.c.name)+'</td><td>'+x.c.units+'</td><td>'+x.f.euro(x.f.ex)+'</td><td><strong>'+x.f.euro(x.f.total)+'</strong></td><td>'+button('Details','financeClient:'+x.id,true)+'</td></tr>').join('')+'</tbody></table></div>'+(chosen?financeDetail(chosen):'<div class="card"><h2>Kies een klant</h2><p>Open de kostenopbouw via de knop Details in het overzicht.</p></div>');
}
function euroCompact(x){return x.toLocaleString('nl-NL',{style:'currency',currency:'EUR',maximumFractionDigits:0})}
let financeClientId=null;
function financeDetail(id){
 const c=demoClients[id],f=demoFinancials(id);
 return '<div class="card"><div class="eyebrow">Kostenraming · '+esc(c.name)+'</div><h2>'+esc(c.unit)+' · '+c.units+' units</h2><table><thead><tr><th>Kostenpost</th><th style="text-align:right">Demo-bedrag</th></tr></thead><tbody>'+f.items.map(x=>'<tr><td>'+esc(x[0])+'</td><td style="text-align:right">'+f.euro(x[1])+'</td></tr>').join('')+'<tr><td>Onvoorzien (10%)</td><td style="text-align:right">'+f.euro(f.reserve)+'</td></tr><tr><th>Subtotaal excl. btw</th><th style="text-align:right">'+f.euro(f.ex)+'</th></tr><tr><td>btw (21%)</td><td style="text-align:right">'+f.euro(f.vat)+'</td></tr><tr><th>Totaal incl. btw</th><th style="text-align:right">'+f.euro(f.total)+'</th></tr></tbody></table><p class="muted">Geen werkelijke projectbegroting. Niet inbegrepen kunnen zijn: netverzwaring, bodemonderzoek, sanering, uitzonderlijk grondwerk, langere transportafstanden en afwijkende afwerking.</p></div>';
}
function globalKnowledgeView(){
 kp='general';
 return title('Medewerkersomgeving','Centrale kennisbank','De gevalideerde algemene kennis is de basis voor Thimo. Projectspecifieke kennis vult deze basis aan.')+'<div class="grid">'+metric(K.records.filter(r=>r.project==='general').length,'Algemene kennisrecords')+metric(K.records.filter(r=>r.project==='general'&&r.approved).length,'Gevalideerd')+metric(K.records.filter(r=>r.project==='general'&&r.approved&&r.visible).length,'Vrijgegeven aan klanten')+'</div>'+staffKnowledgeView().replace('Projectdatabase','Centrale kennisbank').replace('Projectinformatie wordt vastgelegd, gevalideerd en vrijgegeven.','Algemene product-, techniek-, proces- en financiële kennis die voor alle klanten kan worden gebruikt.');
}
menus.client=['AI-assistent'];
menus.staff=['Dashboard','Klantenoverzicht','Klantprojecten','Kennisbank','Financiën','AI-vraagfilter','Projectbesluiten','Commerciële kansen','Projectdatabase','Klantvragen'];
views.Klantenoverzicht=customerOverview;

views.Dashboard=()=>title('Medewerkersomgeving','Thimo365 projectregie','Centraal overzicht van klanten, kennis en financiële ramingen.')+'<div class="grid">'+metric(Object.keys(demoClients).length,'Demo-klanten')+metric(Object.values(K.chats).reduce((a,x)=>a+x.length,0),'Gespreksbeurten')+metric(K.queue.filter(q=>q.status==='Open').length,'Open vragen')+metric(K.records.filter(r=>r.project==='general'&&r.approved&&r.visible).length,'Vrijgegeven kennisrecords')+'</div><div class="card"><h2>Werk vanuit één kennisbasis</h2><p>Algemene gevalideerde kennis wordt gecombineerd met de projectinformatie van de geselecteerde klant. Zo blijft algemene productkennis gescheiden van klantspecifieke afspraken.</p><div class="actions">'+go('Kennisbank')+go('Klantenoverzicht')+go('Financiën')+'</div></div>'+oldStaffDashboard();
const oldProjects=views.Klantprojecten;
views.Klantprojecten=()=>customerOverview();
document.addEventListener('change',e=>{
 if(e.target.id==='customerSelect'){selectedClientId=e.target.value;localStorage.setItem('timo-selected-client',selectedClientId);loadClientUnitSettings();kp=selectedClientId;render()}
 if(e.target.hasAttribute('data-unit-count'))saveClientUnitSettings();
 if(e.target.dataset.unitOption)saveClientUnitSettings();
});
document.addEventListener('click',e=>{
 const a=e.target.closest('[data-act]')?.dataset.act;if(!a)return;
 if(a==='logisticsCheck'){runLogisticsCheck();return}
 if(a.startsWith('clientOpen:')){selectedClientId=a.slice(11);localStorage.setItem('timo-selected-client',selectedClientId);loadClientUnitSettings();role='client';page='AI-assistent';kp=selectedClientId;render()}
 else if(a.startsWith('financeClient:')){financeClientId=a.slice(14);page='Financiën';role='staff';render()}
},true);


/* Vereenvoudigde medewerkersomgeving en fictieve productkostendatabase */
const demoUnitCosts={
 Thimo265:{label:'Compact',total:85000,parts:[['Chassis en vloerconstructie',9000],['Houtconstructie en draagstructuur',14500],['Isolatie en luchtdichting',6500],['Gevelbekleding',6500],['Dakopbouw en dakbedekking',4500],['Ramen en buitendeuren',6500],['Binnenwanden en binnendeuren',5000],['Keuken',4500],['Badkamer en sanitair',5500],['Elektrische installatie',4500],['Waterleidingen en afvoer',3500],['Verwarming en ventilatie',4500],['Binnenafwerking',4500],['Productie-overhead en kwaliteitscontrole',5500]]},
 Thimo365:{label:'Comfort',total:105000,parts:[['Chassis en vloerconstructie',10000],['Houtconstructie en draagstructuur',18000],['Isolatie en luchtdichting',8000],['Gevelbekleding',8000],['Dakopbouw en dakbedekking',5500],['Ramen en buitendeuren',8000],['Binnenwanden en binnendeuren',6000],['Keuken',5500],['Badkamer en sanitair',6500],['Elektrische installatie',5000],['Waterleidingen en afvoer',4000],['Verwarming en ventilatie',5500],['Binnenafwerking',5000],['Productie-overhead en kwaliteitscontrole',10000]]},
 Thimo465:{label:'Ruim',total:125000,parts:[['Chassis en vloerconstructie',12000],['Houtconstructie en draagstructuur',21000],['Isolatie en luchtdichting',9000],['Gevelbekleding',9500],['Dakopbouw en dakbedekking',6500],['Ramen en buitendeuren',9500],['Binnenwanden en binnendeuren',7500],['Keuken',6500],['Badkamer en sanitair',7500],['Elektrische installatie',6000],['Waterleidingen en afvoer',5000],['Verwarming en ventilatie',6500],['Binnenafwerking',6500],['Productie-overhead en kwaliteitscontrole',12000]]}
};
const projectCostItems=[['Transport haven Rotterdam → projectlocatie',750,3500],['Hijsen en positioneren',650,1800],['Plaatsing en montage',4500,0],['Fundering / stelvoorziening',8500,0],['Elektrische aansluiting',0,3500],['Water- en rioolaansluiting',0,4500],['Data / internetvoorziening',0,950],['Engineering en voorbereiding',0,6500]];
const demoEuro=n=>Number(n).toLocaleString('nl-NL',{style:'currency',currency:'EUR',maximumFractionDigits:0});
function productDatabaseView(){
 const unitCards=Object.entries(demoUnitCosts).map(([code,u])=>{
  const sum=u.parts.reduce((a,x)=>a+x[1],0);
  return '<div class="card product-cost-card"><div class="eyebrow">Standaardunit · fictieve kostprijs</div><h2>'+code+' · '+u.label+'</h2><div class="product-unit-total">'+demoEuro(u.total)+' <small>per unit excl. btw</small></div><table><thead><tr><th>Onderdeel</th><th style="text-align:right">Per unit</th></tr></thead><tbody>'+u.parts.map(x=>'<tr><td>'+esc(x[0])+'</td><td style="text-align:right">'+demoEuro(x[1])+'</td></tr>').join('')+'<tr><th>Totaal onderdelen</th><th style="text-align:right">'+demoEuro(sum)+'</th></tr></tbody></table><p class="muted">De onderdelen zijn een fictieve verdeling van de voorbeeldkostprijs; geen leveranciersoffertes of gevalideerde inkoopprijzen.</p></div>';
 }).join('');
 const logistics='<div class="card"><h2>Transport, plaatsing en aansluitingen</h2><p>Deze posten staan los van de fabrieksmatige unitkostprijs.</p><table><thead><tr><th>Kostenonderdeel</th><th style="text-align:right">Variabel per unit</th><th style="text-align:right">Vast per project</th></tr></thead><tbody>'+projectCostItems.map(x=>'<tr><td>'+esc(x[0])+'</td><td style="text-align:right">'+(x[1]?demoEuro(x[1]):'—')+'</td><td style="text-align:right">'+(x[2]?demoEuro(x[2]):'—')+'</td></tr>').join('')+'</tbody></table><p class="muted">Bedragen zijn exclusief btw en gebaseerd op fictieve demo-aannames. Werkelijke kosten hangen onder meer af van afstand, terminal, afmetingen, gewicht, vergunningen, bodem en aansluitpunten.</p></div>';
 return title('Medewerkersomgeving','Productdatabase en kostprijzen','Eén overzicht van de standaardunits, hun onderdelen en bijkomende projectkosten.')+'<div class="notice"><strong>ALLE BEDRAGEN ZIJN FICTIEF.</strong> Uitsluitend bedoeld om de opbouw van de productdatabase en calculatie te demonstreren. Het zijn geen werkelijke Thimo365-inkoopprijzen, verkoopprijzen, marges of offertes.</div>'+Object.entries(demoUnitCosts).map(([code,u])=>'<div class="card product-unit-summary"><strong>'+code+'</strong><span>'+demoEuro(u.total)+' excl. btw per unit</span><small>'+u.label+'</small></div>').join('')+unitCards+logistics+'<div class="card"><h2>Algemene product- en projectkennis</h2><p>Onderstaand onderdeel bevat de centrale kennisrecords die Thimo als basis gebruikt. Projectspecifieke informatie kan hierop aanvullen.</p>'+globalKnowledgeView()+'</div>';
}
function staffProjectHub(){
 const cards=[['AI-vraagfilter','Bundel en beoordeel klantvragen','AI-vraagfilter'],['Projectbesluiten','Leg besluiten en acties vast','Projectbesluiten'],['Commerciële kansen','Volg kansen en vervolgstappen','Commerciële kansen'],['Klantvragen','Behandel openstaande vragen','Klantvragen']];

}
function compactStaffDashboard(){
 return title('Medewerkersomgeving','Thimo365 projectregie','Een helder startpunt voor klanten, producten en projectacties.')+'<div class="grid">'+metric(Object.keys(demoClients).length,'Demo-klanten')+metric(Object.values(K.chats).reduce((a,x)=>a+x.length,0),'Gespreksbeurten')+metric(K.queue.filter(q=>q.status==='Open').length,'Open vragen')+'</div><div class="grid"><div class="card"><h2>Klanten</h2><p>Bekijk per klant de projectstatus, configuratie en gesprekken.</p>'+button('Naar klanten','go:Klanten')+'</div><div class="card"><h2>Productdatabase</h2><p>Bekijk fictieve kostprijzen per unit en per onderdeel.</p>'+button('Naar productdatabase','go:Productdatabase')+'</div><div class="card"><h2>Projectbeheer</h2><p>Werk klantvragen, besluiten en commerciële acties bij.</p>'+button('Naar projectbeheer','go:Projectbeheer')+'</div></div>';
}

if(!views.Klantvragen)views.Klantvragen=()=>title('Projectbeheer','Klantvragen','Open vragen die door medewerkers opgevolgd moeten worden.')+'<div class="card">'+(K.queue.map(q=>'<div class="line"><div>'+esc(q.text)+'<p class="muted">'+esc(demoClients[q.project]?.name||q.project)+' · '+esc(q.status)+'</p></div>'+button(q.status==='Open'?'Afhandelen':'Heropenen','kqueue:'+q.id,true)+'</div>').join('')||'<p>Er staan nog geen klantvragen in de wachtrij.</p>')+'</div>';

render();
</script></body></html>
