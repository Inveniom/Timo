.chatlog{display:flex;flex-direction:column;gap:16px;margin:20px 0;max-height:60vh;overflow:auto;padding:4px}.botbubble,.userbubble{padding:16px;border-radius:12px;max-width:90%;overflow-wrap:anywhere}.botbubble{background:#f1f4ee;border:1px solid var(--line);align-self:flex-start}.userbubble{background:#dce7d2;align-self:flex-end}.source{font-size:12px;border-left:3px solid #64866b;padding:8px;margin:8px 0;color:#53665a;background:white}.botinput{display:flex;gap:10px;align-items:flex-end}.botinput textarea{min-height:65px}.botinput button{flex-shrink:0}.aihero{background:#dfe8d0;border:2px solid #839e75;padding:28px}.aihero h2{font-size:clamp(23px,3vw,34px);margin:12px 0}.websearch{display:inline-block;background:#274638;color:white;padding:12px 16px;border-radius:6px;text-decoration:none;font-weight:600}nav button[data-act="go:AI-assistent"]{background:#274638;color:white;font-weight:700}nav button[data-act="go:AI-assistent"].active{background:#41664e;outline:2px solid #a9c49b}.aiquick{position:fixed;right:20px;bottom:20px;z-index:10;box-shadow:0 4px 20px #0003;border-radius:30px} </style></head><body><header><div class="logo">thimo<span>365</span><small>PROJECT NAVIGATOR · 7.0</small></div><div class="switch"><button id="client">Klantomgeving</button> <button id="staff">Medewerkersomgeving</button></div></header><div class="shell"><nav id="nav"></nav><main id="main"></main></div><footer>Thimo365 Project Navigator 6.0 · Zelfstandige demonstratie · Fictieve gegevens · Concept-huisstijl · <button class="alt" id="reset">Demo herstellen</button></footer><script>
const initial={name:'De Groene Hof',org:'Woningcorporatie',loc:'',count:24,target:'Sociale huur',budget:'',status:'Locatie in onderzoek',type:'Comfort 55',saved:false,decision:false,questions:[],analysis:[],notes:[]};let p;try{p=JSON.parse(localStorage.getItem('thimo-demo-v1'))||structuredClone(initial)}catch{p=structuredClone(initial)}let role='client',page='AI-assistent',search='',draft='';const menus={client:['Overzicht','Projectintake','Woningconfiguratie','Productkennisbank','Haalbaarheid','Mijn project'],staff:['Dashboard','Klantprojecten','AI-vraagfilter','Productbibliotheek','Projectbesluiten','Commerciële kansen']};const kb=[['Woningtypen en afmetingen','Woonoppervlak en woningconfiguraties','Afmetingen en woningtypen'],['Constructie en materialen','Materiaalkeuze en constructie','Constructie en hout'],['Energie en duurzaamheid','Energieprestaties en circulariteit','Energie en duurzaamheid'],['Onderhoud en garanties','Onderhoud en garanties','Onderhoud'],['Planning en realisatie','Indicatieve procesfasen','Doorlooptijd en planning'],['Certificaten en prestaties','Beschikbare prestatieverklaringen','Certificaten']];const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>{try{localStorage.setItem('thimo-demo-v1',JSON.stringify(p))}catch{}};const button=(t,a,alt=false)=>`<button ${alt?'class="alt"':''} data-act="${a}">${t}</button>`;const go=(t)=>button(t,'go:'+t);const title=(a,b,c='')=>`<div class="eyebrow">${a}</div><h1>${b}</h1>${c?`<p>${c}</p>`:''}`;const line=(a,b)=>`<div class="line"><span>${a}</span><span class="tag">${b}</span></div>`;const metric=(a,b)=>`<div class="card"><div class="muted">${b}</div><div class="metric">${a}</div></div>`;const field=(label,k,typ='text')=>`<div><label for="${k}">${label}</label><input id="${k}" data-key="${k}" type="${typ}" ${typ==='number'?'min="1"':''} value="${esc(p[k])}"></div>`;const sel=(label,k,opts)=>`<div><label>${label}</label><select data-key="${k}">${opts.map(o=>`<option ${o===p[k]?'selected':''}>${esc(o)}</option>`).join('')}</select></div>`;const house=(i=1)=>`<svg class="house" viewBox="0 0 400 210" role="img" aria-label="Illustratieve modulaire woning"><rect width="400" height="210" fill="#e5ebdd"/><path d="M0 175H400" stroke="#a4b79c"/><ellipse cx="200" cy="182" rx="165" ry="12" fill="#ccd6c4"/><path d="M60 75L240 42L340 77L160 110Z" fill="#44584c"/><path d="M60 75L160 110V175L60 144Z" fill="#b4a38b"/><path d="M160 110L340 77V143L160 175Z" fill="#c4b69b"/><g fill="#47645c"><path d="M76 95L105 104V135L76 126Z"/><path d="M118 110L144 118V150L118 142Z"/><path d="M180 120L218 113V146L180 153Z"/><path d="M232 110L270 103V136L232 143Z"/><path d="M284 100L323 93V126L284 133Z"/></g><g stroke="#e3dac6" opacity=".8">${Array.from({length:12},(_,j)=>`<path d="M${166+j*14} ${109-j*2.5}v65"/>`).join('')}</g><circle cx="35" cy="134" r="22" fill="#8da77c"/><circle cx="365" cy="133" r="26" fill="#91a981"/></svg>`;
const home=()=>`<div class="hero"><div><div class="eyebrow">Samen wonen realiseren</div><h1>Van woonvraag naar woonoplossing.</h1><p>Een gedeeld projectdossier, van de eerste verkenning tot gezamenlijke besluiten.</p>${go('Projectintake')}</div>${house()}</div><h2>Uw project</h2><div class="grid">${metric(esc(p.count),'Gewenste woningen')}${metric(p.saved?'Ingediend':'Concept','Projectintake')}${metric(p.decision?'Afgerond':'Open','Besluit locatieonderzoek')}</div><div class="card"><h2>${esc(p.name)}</h2>${line('Woningconcept',esc(p.type))}${line('Locatie',esc(p.loc||'Nog onbekend'))}${go('Mijn project')}</div>`;
const intake=()=>title('Stap 01','Uw huisvestingsopgave','Er wordt eenmalig vastgelegd wat u wilt realiseren.')+`<form class="card" id="intake"><div class="fields">${field('Projectnaam','name')}${sel('Type opdrachtgever','org',['Woningcorporatie','Gemeente','Investeerder','Zorgorganisatie'])}${field('Locatie of adres','loc')}${field('Aantal woningen','count','number')}${sel('Doelgroep','target',['Sociale huur','Middenhuur','Senioren','Jongeren','Gemengd'])}${sel('Locatiestatus','status',['Locatie in onderzoek','Locatie beschikbaar','Nog geen locatie'])}${field('Indicatief budget','budget')}</div><div class="actions"><button type="submit">Intake indienen</button></div></form>`;
const config=()=>title('Stap 02','Woningen configureren','Illustratieve woningtypen; geen officiële Thimo365-specificaties.')+`<div class="grid">${['Compact 40','Comfort 55','Ruimte 75'].map((t,i)=>`<div class="card">${house(i)}<h2>${t}</h2><p>${t.split(' ')[1]} m² indicatief</p>${button(p.type===t?'Geselecteerd':'Selecteren','type:'+t,p.type!==t)}</div>`).join('')}</div><div class="card">${field('Aantal woningen','count','number')}${line('Totaal indicatief woonoppervlak',Number(p.count)*Number(p.type.split(' ')[1])+' m²')}<div class="actions">${go('Haalbaarheid')}</div></div>`;
const library=()=>title('Gedeelde kennisbasis',role==='client'?'Productkennisbank':'Productbibliotheek','Eén informatiebron voor klant en medewerker.')+`<div class="card"><label>Zoeken in productinformatie</label><input id="search" value="${esc(search)}" placeholder="Bijvoorbeeld energie of onderhoud"><div id="results">${records()}</div></div><div class="notice">De bibliotheek bevat voorbeeldrecords. Er zijn geen gevalideerde technische prestaties of garanties opgenomen.</div>`;function records(){return kb.filter(a=>a.join(' ').toLowerCase().includes(search.toLowerCase())).map(a=>`<div class="line"><div><strong>${a[0]}</strong><p>${a[1]}</p></div><span class="tag">Voorbeeldrecord</span></div>`).join('')||'<p>Geen resultaten.</p>'}

const dossier=()=>title('Gedeeld projectdossier',esc(p.name))+`<div class="card">${line('Opdrachtgever',esc(p.org))}${line('Aantal woningen',esc(p.count))}${line('Woningconcept',esc(p.type))}${line('Locatie',esc(p.loc||'Onbekend'))}${line('Intake',p.saved?'Ingediend':'Concept')}${line('Locatieonderzoek',p.decision?'Voorbereiding akkoord':'Besluit nodig')}</div><div class="card"><h2>Gerichte projectvraag</h2><label>Bij welk besluit is aanvullende informatie nodig?</label><textarea id="question" placeholder="Beschrijf uw vraag en het gewenste besluit"></textarea><div class="actions">${button('Vraag indienen','question')}</div></div><div class="card"><h2>Ingediende vragen</h2>${p.questions.map(q=>line(esc(q.text),esc(q.status))).join('')||'<p>Nog geen vragen.</p>'}</div>`;
const dashboard=()=>title('Medewerkersomgeving','Regie op klantprojecten','De aandacht wordt gericht op uitzonderingen, afwijkingen en besluiten.')+`<div class="grid">${metric(3,'Actieve demoprojecten')}${metric(p.questions.filter(q=>q.status==='Nieuw').length,'Nieuwe klantvragen')}${metric(p.decision?0:1,'Open projectbesluiten')}</div><div class="card"><h2>Aandacht gevraagd</h2>${line(esc(p.name),p.saved?'Intake ontvangen':'Conceptintake')}${line('Locatieonderzoek',p.decision?'Akkoord':'Besluit nodig')}${line('Vraagfilter',p.analysis.length?p.analysis.length+' vragen geanalyseerd':'Nog niet uitgevoerd')}<div class="actions">${go('AI-vraagfilter')}${go('Projectbesluiten')}</div></div>`;
const projects=()=>title('Projectportfolio','Klantprojecten')+`<div class="card">${line(esc(p.name),p.saved?'Intake ontvangen':'Concept')}${line('De Brink · 36 woningen','Haalbaarheid')}${line('Parkzicht · 48 woningen','Voorbereiding')}<div class="actions">${button('Open gezamenlijk dossier','clientdossier')}</div></div><p class="muted">Alle projecten zijn fictief.</p>`;
const categories=['Kennisbank','Dubbel of overlappend','Latere projectfase','Projectspecifiek','Gezamenlijk besluit'];const sample=['Wat is de energieprestatie?','Wat is de energieprestatie?','Welke materialen worden toegepast?','Wat is de planning?','Hoe wordt het onderhoud geregeld?','Welke certificaten zijn beschikbaar?','Hoe wordt de fundering op deze locatie ontworpen?','Wie neemt het besluit over locatieonderzoek?','Wat is de definitieve opleverinspectie?','Wat kost het specifieke project?'];function classify(t,seen){let k=t.toLowerCase().trim().replace(/[^\p{L}\p{N} ]/gu,'').replace(/\s+/g,' ');if(seen.has(k))return categories[1];seen.add(k);if(/opleverinspectie|na oplevering|later stadium/.test(k))return categories[2];if(/besluit|akkoord|goedkeuring/.test(k))return categories[4];if(/specifiek|deze locatie|fundering|prijs|kost/.test(k))return categories[3];if(/energie|materiaal|onderhoud|garantie|certificat|planning|afmeting|woningtype|doorlooptijd/.test(k))return categories[0];return categories[3]}
const filter=()=>title('Van vraag naar besluit','AI-vraagfilter','De demonstratie gebruikt eenvoudige lokale herkenningsregels, geen echte AI. Elke indeling kan handmatig worden aangepast.')+`<div class="card"><label>Uitvraag (één vraag per regel)</label><textarea id="draft" placeholder="Plak een reeks klantvragen">${esc(draft)}</textarea><div class="actions">${button('Voorbeelduitvraag laden','sample',true)}${button('Analyse uitvoeren','analyse')}</div>${p.questions.length?`<div class="actions">${button('Klantvragen toevoegen','import',true)}</div>`:''}</div>${analysisView()}`;function analysisView(){if(!p.analysis.length)return '';let counts=categories.map(c=>p.analysis.filter(q=>q.category===c).length);return `<div class="card"><h2>Resultaat vraaganalyse</h2><div class="grid">${metric(p.analysis.length,'Ontvangen vragen')}${metric(counts[3]+counts[4],'Inhoudelijk te beoordelen')}</div>${categories.map((c,i)=>`<div class="line"><span>${c}</span><strong>${counts[i]}</strong></div><div class="bar"><i style="width:${100*counts[i]/p.analysis.length}%"></i></div>`).join('')}<p class="muted">Een koppeling aan een voorbeeldrecord is geen inhoudelijk antwoord. Menselijke controle blijft noodzakelijk.</p></div><div class="card"><h2>Beoordeling per vraag</h2>${p.analysis.map((q,i)=>`<div class="line"><div style="flex:1">${esc(q.text)}</div><select style="max-width:230px" data-class="${i}">${categories.map(c=>`<option ${q.category===c?'selected':''}>${c}</option>`).join('')}</select></div>`).join('')}</div>`}
const decisions=()=>title('Menselijke besluitvorming','Projectbesluiten')+`<div class="card"><span class="tag">${p.decision?'Afgerond':'Ter beoordeling'}</span><h2 style="margin-top:16px">Locatieonderzoek · ${esc(p.name)}</h2><p>Er wordt bepaald of een afzonderlijk locatieonderzoek wordt voorbereid. Dit besluit heeft geen contractuele betekenis.</p>${button(p.decision?'Besluit heropenen':'Voorbereiding akkoord','decision')}</div>`;
const commercial=()=>title('Commerciële werkwijze','Van verkenning naar opdracht')+`<div class="card"><table><thead><tr><th>Dienstverlening</th><th>Model</th></tr></thead><tbody>${[['Algemene productinformatie','Vrij toegankelijk'],['Standaard projectverkenning','Kosteloos'],['Indicatieve configuratie','Kosteloos'],['Uitgebreid locatieonderzoek','Betaalde opdracht'],['Gedetailleerde businesscase','Betaalde opdracht'],['Technische maatwerkuitwerking','Betaalde opdracht'],['Projectontwikkeling','Contractuele samenwerking']].map(([a,b])=>`<tr><td>${a}</td><td>${b}</td></tr>`).join('')}</tbody></table></div>`;
const views={'Overzicht':home,'Projectintake':intake,'Woningconfiguratie':config,'Productkennisbank':library,'Haalbaarheid':feasibility,'Mijn project':dossier,'Dashboard':dashboard,'Klantprojecten':projects,'AI-vraagfilter':filter,'Productbibliotheek':library,'Projectbesluiten':decisions,'Commerciële kansen':commercial};function render(){document.getElementById('client').className=role==='client'?'active':'';document.getElementById('staff').className=role==='staff'?'active':'';document.getElementById('nav').innerHTML=menus[role].map(t=>`<button data-act="go:${t}" class="${page===t?'active':''}">${t}</button>`).join('');document.getElementById('main').innerHTML=views[page]();save()}function switchRole(r){role=r;page=menus[r][0];render()}document.getElementById('client').onclick=()=>switchRole('client');document.getElementById('staff').onclick=()=>switchRole('staff');document.getElementById('reset').onclick=()=>{if(confirm('Alle lokale demogegevens herstellen?')){p=structuredClone(initial);draft='';switchRole('client')}};document.addEventListener('input',e=>{let el=e.target;if(el.dataset.key){p[el.dataset.key]=el.type==='number'?Math.max(0,Number(el.value)):el.value;save()}if(el.id==='search'){search=el.value;document.getElementById('results').innerHTML=records()}if(el.id==='draft')draft=el.value});document.addEventListener('change',e=>{if(e.target.dataset.class!==undefined){p.analysis[Number(e.target.dataset.class)].category=e.target.value;render()}else if(e.target.dataset.key==='count'&&page==='Woningconfiguratie')render()});document.addEventListener('submit',e=>{if(e.target.id==='intake'){e.preventDefault();if(!p.name.trim()||p.count<1){alert('Vul een projectnaam en geldig aantal woningen in.');return}p.saved=true;page='Woningconfiguratie';render()}});document.addEventListener('click',e=>{let a=e.target.closest('[data-act]')?.dataset.act;if(!a)return;if(a.startsWith('go:')){page=a.slice(3);search=''}else if(a.startsWith('type:'))p.type=a.slice(5);else if(a==='question'){let q=document.getElementById('question').value.trim();if(!q)return;p.questions.push({text:q,status:'Nieuw'})}else if(a==='sample')draft=sample.join('\n');else if(a==='import')draft=[draft,...p.questions.map(q=>q.text)].filter(Boolean).join('\n');else if(a==='analyse'){let seen=new Set();p.analysis=draft.split('\n').map(t=>t.trim()).filter(Boolean).map(text=>({text,category:classify(text,seen)}));p.questions.forEach(q=>{if(p.analysis.some(x=>x.text===q.text))q.status='Geanalyseerd'})}else if(a==='decision')p.decision=!p.decision;else if(a==='clientdossier'){role='client';page='Mijn project'}render()});const domains=['Locatie','Woonprogramma','Techniek','Financiën','Planning','Vergunningen','Duurzaamheid','Contracten','Besluiten','Documentatie'];
const seed=()=>({records:[['groene','Woonprogramma','Aantal woningen','24 modulaire woningen (fictief uitgangspunt).','aantal woningen,hoeveel woningen,woningaantal','Demo-intake'],['groene','Planning','Oplevering','Indicatief vierde kwartaal 2027; geen toezegging.','oplevering,opleverdatum,wanneer klaar,opgeleverd','Demo-planning'],['groene','Vergunningen','Omgevingsvergunning','Nog niet aangevraagd.','vergunningstatus,status van de vergunning,vergunning aangevraagd','Demo-dossier'],['groene','Techniek','Woonoppervlak','55 m² per woning (illustratief).','woonoppervlak,oppervlakte,vierkante meter','Demo-configuratie'],['brink','Woonprogramma','Aantal woningen','36 woningen (fictief).','aantal woningen,hoeveel woningen','Demo-intake De Brink'],['park','Woonprogramma','Aantal woningen','48 woningen (fictief).','aantal woningen,hoeveel woningen','Demo-intake Parkzicht'],['groene','Financiën','Interne raming','Nog in voorbereiding.','kosten,prijs,raming','Demo interne raming']].map((a,i)=>({id:'r'+i,project:a[0],domain:a[1],subject:a[2],value:a[3],aliases:a[4],source:a[5],approved:i!==6,visible:i!==6,version:1,date:'2026-11-24'})),queue:[]});
let K;try{K=JSON.parse(localStorage.getItem('thimo-knowledge-v3'))||seed()}catch{K=seed()}

function renderCustomerProposal(turns){
 const latest=[...turns].reverse().find(t=>t.proposal&&(t.proposal.title||t.proposal.summary||t.proposal.unit_type||t.proposal.specifications?.length));
 if(!latest)return '';
 const d=latest.proposal||{};
 const count=Math.max(0,Math.min(16,Number(d.unit_count)||0));
 const shown=count||1;
 const rows=Math.ceil(shown/4);
 const height=70+rows*62;
 const blocks=Array.from({length:shown},(_,i)=>{const x=18+(i%4)*88,y=22+Math.floor(i/4)*62;return '<rect x="'+x+'" y="'+y+'" width="68" height="42" rx="4" fill="#dce8d5" stroke="#47664f" stroke-width="1.5"/><text x="'+(x+34)+'" y="'+(y+25)+'" text-anchor="middle" font-size="11" fill="#274638">'+(i+1)+'</text>'}).join('');
 const diagram='<svg viewBox="0 0 380 '+height+'" role="img" aria-label="Schematische conceptopstelling"><rect x="8" y="8" width="364" height="'+(height-16)+'" rx="8" fill="#f2f6ef" stroke="#9caf98" stroke-dasharray="5 4"/>'+blocks+'<path d="M14 '+(height-24)+'H366" stroke="#a8b9a2" stroke-width="8"/><text x="190" y="'+(height-10)+'" text-anchor="middle" font-size="9" fill="#526b56">indicatieve ontsluiting</text></svg>';
 const specs=(d.specifications||[]).map(x=>'<li>'+esc(x)+'</li>').join('');
 const costs=(d.cost_breakdown||[]).map(x=>'<li>'+esc(x)+'</li>').join('');
 const missing=(d.missing_information||[]).map(x=>'<li>'+esc(x)+'</li>').join('');
 const area=Number(d.bvo_per_unit_m2)>0?Number(d.bvo_per_unit_m2).toLocaleString('nl-NL')+' m² BVO per unit':'Nog te bevestigen';
 const total=Number(d.total_bvo_m2)>0?Number(d.total_bvo_m2).toLocaleString('nl-NL')+' m² BVO totaal':'Nog te bepalen';
 return '<section class="card" style="border:2px solid #9caf98;background:#fbfcf8"><div class="eyebrow">Voorlopig klantvoorstel</div><h2>'+esc(d.title||'Uw eerste ontwerpvoorstel')+'</h2><p>'+esc(d.summary||'Het voorstel wordt tijdens het gesprek verder ingevuld.')+'</p><div class="grid"><div><h3>Conceptopstelling</h3>'+diagram+'<p class="muted">Schematische illustratie, niet op schaal en niet ingepast op een gecontroleerd perceel. '+(count?count+' units weergegeven.':'Aantal units nog niet bepaald.')+'</p></div><div><h3>Uitgangspunten</h3><div class="line"><span>Voorkeurstype</span><strong>'+esc(d.unit_type||'Nog te bepalen')+'</strong></div><div class="line"><span>Aantal</span><strong>'+(count?String(Number(d.unit_count)): 'Nog te bepalen')+'</strong></div><div class="line"><span>Oppervlakte per unit</span><strong>'+area+'</strong></div><div class="line"><span>Totaal BVO</span><strong>'+total+'</strong></div><p>'+esc(d.layout_description||'De opstelling wordt verder uitgewerkt zodra de belangrijkste wensen bekend zijn.')+'</p></div></div><div class="grid"><div><h3>Specificaties</h3><ul>'+(specs||'<li>Worden tijdens het gesprek aangevuld.</li>')+'</ul></div><div><h3>Indicatieve kostenopbouw</h3><p><strong>'+esc(d.indicative_price||'Nog niet verantwoord te ramen: gevalideerde prijsinformatie ontbreekt.')+'</strong></p><ul>'+(costs||'<li>Product, opties, transport, plaatsing en locatiekosten moeten nog worden vastgesteld.</li>')+'</ul></div></div>'+(missing?'<h3>Nog te onderzoeken</h3><ul>'+missing+'</ul>':'')+'<p class="muted">Dit is een vrijblijvend concept. Geen maatvaste tekening, technische goedkeuring of bindende offerte. Alle productspecificaties en bedragen moeten door Thimo365 worden bevestigd.</p></section>';
}
function chatView(){
 kp='customer';
 const turns=K.chats[kp]||[];
 const endpoint=localStorage.getItem('timo-worker-endpoint')||'https://timo-agent.martijn-d1c.workers.dev';
 localStorage.setItem('timo-worker-endpoint',endpoint);
 return title('Klantomgeving','Timo · van wens naar ontwerp','Vertel wat u wilt realiseren. Timo stelt gerichte vragen en werkt toe naar een visueel concept, specificaties en een indicatieve prijsopgave.')+`<div class="card"><div class="eyebrow">Uw digitale ontwerpadviseur</div><p>Welkom! Ik help u uw woon- of huisvestingsvraag stap voor stap te vertalen naar een eerste ontwerpvoorstel. U hoeft niet alles vooraf te weten.</p>
 <div class="chatlog" aria-live="polite"><div class="botbubble"><strong>Timo</strong><p>Waar denkt u aan? Vertel gerust in uw eigen woorden wat u wilt realiseren, voor wie het bedoeld is en waar het project ongeveer plaatsvindt.</p></div>
 ${turns.map((t,i)=>`<div class="userbubble">${esc(t.question)}</div><div class="botbubble"><strong>Timo</strong>${t.answer?`<p style="white-space:pre-wrap">${esc(t.answer)}</p>`: '<p class="muted">Timo denkt na…</p>'}<div class="actions">${t.sent?'<span class="tag">Voorgelegd aan medewerker</span>':button('Voorleggen aan medewerker','botEsc:'+i,true)}</div></div>`).join('')}</div>
 ${renderCustomerProposal(turns)}
 ${turns.length?'':`<div class="actions">${chatExamples.slice(0,5).map((q,i)=>button(q,'botExample:'+i,true)).join('')}</div>`}
 <form id="botform"><label for="botq">Uw bericht aan Timo</label><div class="botinput"><textarea id="botq" required rows="2" placeholder="Bijvoorbeeld: Ik zoek 12 modulaire woningen voor starters in Utrecht…"></textarea><button type="submit">Verstuur</button></div></form>
 <div id="botStatus" class="muted" role="status">${esc(botConnectionStatus||'Timo is gekoppeld aan de beveiligde AI-dienst.')}</div><div class="actions">${button('Nieuw gesprek','botReset',true)}</div></div>
 <div class="notice">Timo maakt een eerste, vrijblijvende verkenning. De schets is conceptueel en niet op schaal. Prijzen worden alleen getoond wanneer gevalideerde prijsinformatie beschikbaar is; anders benoemt Timo welke posten nog moeten worden geprijsd.</div>`;
}
async function sendBot(q){
 q=q.trim();if(!q)return;
 const endpoint=(document.getElementById('workerEndpoint')?.value||localStorage.getItem('timo-worker-endpoint')||'https://timo-agent.martijn-d1c.workers.dev').trim();
 if(!/^https:\/\/[a-z0-9.-]+(?::\\d+)?(?:\/.*)?$/i.test(endpoint)){alert('Vul eerst het HTTPS-adres van de Cloudflare Worker in.');return}
 localStorage.setItem('timo-worker-endpoint',endpoint);
 const turns=(K.chats[kp]||=[]);
 const refs=botLookup(q,kp);
 const turn={question:q,refs:refs.map(r=>({id:r.id,version:r.version})),sent:false,answer:''};
 turns.push(turn);ks();render();
 botConnectionStatus='De AI-agent denkt na…';render();
 const buttonEl=document.querySelector('#botform button[type="submit"]');if(buttonEl)buttonEl.disabled=true;
 const messages=[];
 for(const t of turns.slice(-9)){messages.push({role:'user',content:t.question});if(t.answer)messages.push({role:'assistant',content:t.answer})}
 const knowledge=refs.slice(0,12).map(r=>'['+r.subject+'] '+r.value+' (Bron: '+r.source+')').join('\n\n');
 try{
  const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),35000);
  let response;try{response=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages,knowledge}),signal:controller.signal})}finally{clearTimeout(timer)}
  const data=await response.json();if(!response.ok||!data.answer)throw new Error(data.error||'Worker reageert niet (HTTP '+response.status+')');
  turn.answer=data.answer;turn.proposal=data.proposal||null;botConnectionStatus='Antwoord ontvangen via Timo AI.';ks();render();
 }catch(error){turn.answer='De AI-agent kon geen antwoord ophalen: '+(error.name==='AbortError'?'de aanvraag duurde te lang.':error.message)+'. Controleer het Worker-adres, de GitHub Actions-uitrol en de Cloudflare/OpenAI-instellingen.';botConnectionStatus='Verbinding mislukt.';ks();render()}
}
menus.client=['AI-assistent',...menus.client.filter(t=>!['Projectassistent','AI-assistent'].includes(t))];views['AI-assistent']=chatView;views.Projectassistent=chatView;views.Projectdatabase=staffKnowledgeView;
const oldLibrary=views.Productbibliotheek;views.Productbibliotheek=()=>oldLibrary()+`<div class="card"><h2>Algemene botkennis beheren</h2><p>Beheer gevalideerde antwoorden die voor alle projecten beschikbaar mogen zijn.</p>${button('Algemene kennisbank beheren','botGeneral')}</div>`;
const oldHome=views.Overzicht;views.Overzicht=()=>`<div class="card aihero"><div class="eyebrow">UW DIGITALE PROJECTASSISTENT</div><h2>Waar kunnen wij u mee helpen?</h2><p>Stel direct een vraag over uw Timo, techniek, planning of project.</p><form id="homebotform"><label for="homebotq">Uw vraag</label><div class="botinput"><input id="homebotq" required placeholder="Bijvoorbeeld: welke fundering is nodig?"><button type="submit">Vraag de assistent</button></div></form><div class="actions">${go('AI-assistent')}</div></div>`+oldHome();
 document.addEventListener('submit',e=>{if(e.target.id==='homebotform'){e.preventDefault();const q=document.getElementById('homebotq').value;page='AI-assistent';kp='customer';sendBot(q)}});

document.addEventListener('submit',e=>{if(e.target.id==='botform'){e.preventDefault();sendBot(document.getElementById('botq').value)}});
document.addEventListener('click',e=>{const a=e.target.closest('[data-act]')?.dataset.act;if(!a?.startsWith('bot'))return;e.stopImmediatePropagation();if(a.startsWith('botExample:')){sendBot(chatExamples[Number(a.slice(11))]);return}if(a.startsWith('botEsc:')){const t=K.chats[kp]?.[Number(a.slice(7))];if(t){if(!K.queue.some(x=>x.project===kp&&x.text===t.question&&x.status==='Open'))K.queue.push({id:crypto.randomUUID(),project:kp,text:t.question,status:'Open'});t.sent=true}}else if(a==='botReset'){if(!confirm('Dit lokale gesprek wissen?'))return;K.chats[kp]=[]}else if(a==='botGeneral'){kp='general';editing=null;page='Projectdatabase'}ks();render()},true);
const baseReset=document.getElementById('reset').onclick;document.getElementById('reset').onclick=()=>{baseReset();migrate()};

const quick=document.createElement('button');quick.className='aiquick';quick.textContent='Vraag de AI-assistent';quick.onclick=()=>{role='client';page='AI-assistent';render();document.getElementById('botq')?.focus()};document.body.appendChild(quick);const syncQuick=()=>{quick.hidden=role!=='client'||page==='AI-assistent'};const prevRender=render;render=function(){prevRender();syncQuick()};

// Version 7: shared knowledge catalogue and explicit knowledge gaps.
const catalogView=()=>title('Klantomgeving','Kennisbank','Vrijgegeven algemene kennis en openbare leveranciersinformatie.')+`<div class="card"><label>Zoek in de kennisbank</label><input id="catalogSearch" placeholder="Bijvoorbeeld hoogte, fundering of levertijd"><div id="catalogResults">${catalogResults('')}</div></div>`;
function catalogResults(q){return K.records.filter(r=>r.project==='general'&&r.approved&&r.visible&&norm(r.subject+' '+r.aliases+' '+r.value).includes(norm(q))).map(r=>`<div class="line"><div><strong>${esc(r.subject)}</strong><p>${esc(r.value)}</p><small>${esc(r.source)} · versie ${r.version}</small></div></div>`).join('')||'<p>Geen passende records.</p>'}
views.Productkennisbank=catalogView;
document.addEventListener('input',e=>{if(e.target.id==='catalogSearch')document.getElementById('catalogResults').innerHTML=catalogResults(e.target.value)});
const staffDash=views.Dashboard;views.Dashboard=()=>{const turns=Object.values(K.chats).flat();return title('Medewerkersomgeving','Kennisdekking en klantvragen')+`<div class="grid">${metric(K.records.length,'Kennisrecords')}${metric(turns.length,'Chatvragen')}${metric(turns.filter(t=>t.refs.length).length,'Vragen met bronresultaat')}${metric(K.queue.filter(q=>q.status==='Open').length,'Open vragen')}</div><div class="card"><p>Een bronresultaat is geen bewijs van een volledig of juist antwoord.</p><div class="actions">${button('Algemene kennisbank','botGeneral')}${go('Projectdatabase')}${go('Klantvragen')}</div></div>`+staffDash()};
menus.staff.push('Klantvragen');views.Klantvragen=()=>title('Medewerkersomgeving','Klantvragen en kennishiaten')+`<div class="card"><h2>Wachtrij per project</h2>${K.queue.map(q=>`<div class="line"><div>${esc(names()[q.project]||q.project)} · ${esc(q.text)}<p>${esc(q.status)}</p></div>${button(q.status==='Open'?'Afhandelen':'Heropenen','kqueue:'+q.id,true)}</div>`).join('')||'<p>Geen doorgestuurde vragen.</p>'}</div><div class="card"><h2>Gesprekshistorie</h2>${Object.entries(K.chats).flatMap(([id,ts])=>ts.map(t=>`<div class="line"><div>${esc(names()[id]||id)} · ${esc(t.question)}</div><span class="tag">${t.refs.length?'Bronresultaat':'Kennishiaat'}</span></div>`)).join('')||'<p>Nog geen gesprekken.</p>'}</div>`;
const fixedReset=document.getElementById('reset');fixedReset.onclick=()=>{if(confirm('Alle lokale demogegevens herstellen?')){p=structuredClone(initial);draft='';K=seed();kp='groene';editing=null;kq='';asked='';migrate();switchRole('client')}};

render();
</script></body></html>
