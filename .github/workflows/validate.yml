name: Validate Thimo365 rebuild
on:
  push:
    branches: ["main", "rebuild/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check frontend JavaScript
        run: node --check app.js
      - name: Check Cloudflare Worker JavaScript
        run: node --check ai-backend/worker.js
      - name: Install Wrangler
        run: npm install --global wrangler
      - name: Validate Cloudflare Worker bundle and bindings
        run: wrangler deploy --dry-run --config ai-backend/wrangler.toml
      - name: Smoke test local Worker API and role filtering
        run: |
          set -euo pipefail
          wrangler dev --config ai-backend/wrangler.toml --port 8787 > /tmp/thimo-worker.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/ > /tmp/thimo-health.json; then break; fi
            sleep 2
          done
          test -s /tmp/thimo-health.json
          CLIENT_AUTH=$(curl -fsS -H 'Origin: https://inveniom.github.io' -H 'Content-Type: application/json' -d '{"role":"client","projectId":"p-parkzicht","customerId":"c-parkzicht"}' http://127.0.0.1:8787/api/auth)
          CLIENT_TOKEN=$(node -e 'console.log(JSON.parse(process.argv[1]).token)' "$CLIENT_AUTH")
          CLIENT_STATE=$(curl -fsS -H 'Origin: https://inveniom.github.io' -H "Authorization: Bearer $CLIENT_TOKEN" http://127.0.0.1:8787/api/state)
          node -e 'const s=JSON.parse(process.argv[1]);if(s.data.projects.length!==1||s.data.projectOptions.length!==3||s.data.costs.some(x=>"cost" in x))process.exit(1)' "$CLIENT_STATE"
          STAFF_AUTH=$(curl -fsS -H 'Origin: https://inveniom.github.io' -H 'Content-Type: application/json' -d '{"role":"staff"}' http://127.0.0.1:8787/api/auth)
          STAFF_TOKEN=$(node -e 'console.log(JSON.parse(process.argv[1]).token)' "$STAFF_AUTH")
          STAFF_STATE=$(curl -fsS -H 'Origin: https://inveniom.github.io' -H "Authorization: Bearer $STAFF_TOKEN" http://127.0.0.1:8787/api/state)
          node -e 'const s=JSON.parse(process.argv[1]);if(!s.data.costs.some(x=>"cost" in x)||s.data.projects.length!==3)process.exit(1)' "$STAFF_STATE"
          STAFF_PROJECT=$(node -e 'const s=JSON.parse(process.argv[1]);console.log(JSON.stringify(s.data.projects[0]))' "$STAFF_STATE")
          node -e 'const p=JSON.parse(process.argv[1]);p.workflow={commercialTerms:"INTERNAL TEST ONLY"};console.log(JSON.stringify(p))' "$STAFF_PROJECT" > /tmp/thimo-project.json
          curl -fsS -X POST -H 'Origin: https://inveniom.github.io' -H 'Content-Type: application/json' -H "Authorization: Bearer $STAFF_TOKEN" --data-binary "{\"collection\":\"projects\",\"record\":$(cat /tmp/thimo-project.json)}" http://127.0.0.1:8787/api/record > /dev/null
          CLIENT_STATE=$(curl -fsS -H 'Origin: https://inveniom.github.io' -H "Authorization: Bearer $CLIENT_TOKEN" http://127.0.0.1:8787/api/state)
          node -e 'const s=JSON.parse(process.argv[1]);if("workflow" in s.data.projects[0])process.exit(1)' "$CLIENT_STATE"
          curl -fsS -X POST -H 'Origin: https://inveniom.github.io' -H 'Content-Type: application/json' -H "Authorization: Bearer $STAFF_TOKEN" -d '{"collection":"documents","record":{"id":"doc-unapproved","projectId":"p-parkzicht","name":"Intern test","status":"Ontvangen","audience":"customer"}}' http://127.0.0.1:8787/api/record > /dev/null
          CLIENT_STATE=$(curl -fsS -H 'Origin: https://inveniom.github.io' -H "Authorization: Bearer $CLIENT_TOKEN" http://127.0.0.1:8787/api/state)
          node -e 'const s=JSON.parse(process.argv[1]);if(s.data.documents.some(x=>x.id==="doc-unapproved"))process.exit(1)' "$CLIENT_STATE"
          curl -fsS -X POST -H 'Origin: https://inveniom.github.io' -H 'Content-Type: application/json' -H "Authorization: Bearer $STAFF_TOKEN" -d '{"collection":"documents","record":{"id":"doc-approved","projectId":"p-parkzicht","name":"Klantdocument","status":"Goedgekeurd","audience":"customer"}}' http://127.0.0.1:8787/api/record > /dev/null
          CLIENT_STATE=$(curl -fsS -H 'Origin: https://inveniom.github.io' -H "Authorization: Bearer $CLIENT_TOKEN" http://127.0.0.1:8787/api/state)
          node -e 'const s=JSON.parse(process.argv[1]);if(!s.data.documents.some(x=>x.id==="doc-approved"))process.exit(1)' "$CLIENT_STATE"
          CLIENT_WRITE=$(curl -sS -o /tmp/thimo-client-write.json -w '%{http_code}' -X POST -H 'Origin: https://inveniom.github.io' -H 'Content-Type: application/json' -H "Authorization: Bearer $CLIENT_TOKEN" -d '{"collection":"costs","record":{"id":"cost-1"}}' http://127.0.0.1:8787/api/record)
          test "$CLIENT_WRITE" = "403"
          SUPPLIER_AUTH=$(curl -fsS -H 'Origin: https://inveniom.github.io' -H 'Content-Type: application/json' -d '{"role":"supplier"}' http://127.0.0.1:8787/api/auth)
          SUPPLIER_TOKEN=$(node -e 'console.log(JSON.parse(process.argv[1]).token)' "$SUPPLIER_AUTH")
          SUPPLIER_STATE=$(curl -fsS -H 'Origin: https://inveniom.github.io' -H "Authorization: Bearer $SUPPLIER_TOKEN" http://127.0.0.1:8787/api/state)
          node -e 'const s=JSON.parse(process.argv[1]);if(s.data.costs.length!==0||s.data.projects.some(p=>"budget" in p))process.exit(1)' "$SUPPLIER_STATE"
      - name: Check required application files
        run: |
          test -s index.html
          test -s styles.css
          test -s app.js
          test -s ai-backend/wrangler.toml
